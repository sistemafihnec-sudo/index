<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIHNEC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <img src="logo.png" class="logo">
  <h2 id="tituloBienvenida">Bienvenido Capitulo -</h2>
  <p id="infoUsuario"></p>
  <div class="grid">
<div id="btnTesoreria" class="card-btn" onclick="location.href='tesoreria.html'">💰 TESORERÍA</div>
    <div id="btnSecretaria" class="card-btn" onclick="location.href='secretaria.html'">📋 SECRETARÍA</div>
    <div class="card-btn" onclick="location.href='reportes.html'">📊 REPORTES</div>
  </div>
  <button onclick="logout()">Cerrar sesión</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB1SeqgsMF6qFSEm8M4rlF9QeBP2F2HP4Q",
  authDomain: "sistema2026-fihnec.firebaseapp.com",
  projectId: "sistema2026-fihnec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = "login.html"; return; }

  const docUser = await db.collection("usuarios").doc(user.uid).get();
  if (!docUser.exists) return;

  const data          = docUser.data();
  const codigoCapitulo = data.codigoCapitulo || "";
  const rol            = data.rol || "";

  // Buscar nombre del capítulo en sedes
  let nombreCapitulo = codigoCapitulo;
  if (codigoCapitulo) {
    const docSede = await db.collection("sedes").doc(codigoCapitulo).get();
    if (docSede.exists && docSede.data().nombre) {
      nombreCapitulo = docSede.data().nombre;
    }
  }

  // Mostrar bienvenida con nombre del capítulo
  if (codigoCapitulo) {
    document.getElementById("tituloBienvenida").innerText = "Bienvenido, " + nombreCapitulo;
  } else {
    document.getElementById("tituloBienvenida").innerText = "Bienvenido";
  }

 // Info adicional debajo
  document.getElementById("infoUsuario").innerText =
    (codigoCapitulo ? "Capítulo: " + codigoCapitulo + "  |  " : "") +
    "Rol: " + rol;

  // Ocultar Tesorería y Secretaría a usuarios supervisores
  if (rol !== "tesorero") {
    document.getElementById("btnTesoreria").style.display = "none";
    document.getElementById("btnSecretaria").style.display = "none";
  }
});

function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>
</body>
</html>
