<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FIHNEC - Login</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
<div class="app">
  <img src="logo.png" class="logo">
  <h2 class="titulo">FIHNEC</h2>
  <p class="sub">REGISTRO DE EVENTOS DE LA FRATERNIDAD INERNACIONAL DE HOMBRES DE NEGOCIOS DEL EVANGELIO COMPLETO</p>
  <div class="card">
    <input id="email" placeholder="Correo">
    <div style="position:relative; display:flex; align-items:center;">
      <input id="password" type="password" placeholder="Contraseña" style="flex:1; padding-right:40px;">
      <span onclick="togglePassword()" style="position:absolute; right:10px; cursor:pointer; font-size:18px; user-select:none;" id="ojito">👁️</span>
    </div>
    <div id="camposRegistro" style="display:none;">
      <input id="codigo" placeholder="Código de Capítulo" oninput="this.value = this.value.toUpperCase()">
      <input id="nombre" placeholder="Nombre">
      <input id="ciudad" placeholder="Ciudad">
      <input id="local" placeholder="Local">
    </div>
    <button id="btnAccion">Ingresar</button>
    <div class="links">
      <span onclick="modoRegistro()">Crear cuenta</span>
      <span onclick="modoLogin()">Ya tengo cuenta</span>
    </div>
    <p id="msg"></p>
  </div>
</div>

<!-- Firebase COMPAT -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB1SeqgsMF6qFSEm8M4rlF9QeBP2F2HP4Q",
  authDomain: "sistema2026-fihnec.firebaseapp.com",
  projectId: "sistema2026-fihnec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// TOGGLE CONTRASEÑA
function togglePassword() {
  const input = document.getElementById("password");
  const ojito = document.getElementById("ojito");
  if (input.type === "password") {
    input.type = "text";
    ojito.textContent = "🙈";
  } else {
    input.type = "password";
    ojito.textContent = "👁️";
  }
}

// REGISTRO
async function registro() {
  const msg      = document.getElementById("msg");
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const codigo   = document.getElementById("codigo").value.trim().toUpperCase();
  const nombre   = document.getElementById("nombre").value.trim();
  const ciudad   = document.getElementById("ciudad").value.trim();
  const local    = document.getElementById("local").value.trim();

  if (!email || !password || !codigo || !nombre || !ciudad || !local) {
    msg.innerText = "Completa todos los campos";
    return;
  }

  msg.innerText = "Registrando...";

  try {
    // 1. Buscar el capítulo en sedes para obtener campo, zona y región
    const sedeDoc = await db.collection("sedes").doc(codigo).get();

    let campo  = "";
    let zona   = "";
    let region = "";

    if (sedeDoc.exists) {
      const sede = sedeDoc.data();
      campo  = sede.campo  || "";
      zona   = sede.zona   || "";
      region = sede.region || "";
    } else {
      // Si no existe la sede, la creamos con los datos básicos
      await db.collection("sedes").doc(codigo).set({ nombre, ciudad, local });
    }

    // 2. Crear usuario en Firebase Auth
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
    const uid = userCredential.user.uid;

    // 3. Guardar usuario con toda la jerarquía
    await db.collection("usuarios").doc(uid).set({
      email,
      codigoCapitulo: codigo,
      campo,
      zona,
      region,
      rol: "tesorero"
    });

    msg.innerText = campo
      ? `Registro completo ✓ — Campo: ${campo} | Zona: ${zona} | Región: ${region}`
      : "Registro completo ✓ — (Pide al administrador que complete tu clasificación en Firestore)";

  } catch (e) {
    msg.innerText = e.message;
  }
}

// LOGIN
function login() {
  const msg      = document.getElementById("msg");
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(() => { window.location.href = "index.html"; })
    .catch(e => msg.innerText = e.message);
}

// RECUPERAR
function recuperar() {
  const email = document.getElementById("email").value.trim();
  auth.sendPasswordResetEmail(email)
    .then(() => document.getElementById("msg").innerText = "Correo enviado")
    .catch(e => document.getElementById("msg").innerText = e.message);
}

function modoRegistro() {
  document.getElementById("camposRegistro").style.display = "block";
  document.getElementById("btnAccion").innerText = "Registrar";
  document.getElementById("btnAccion").onclick = registro;
}

function modoLogin() {
  document.getElementById("camposRegistro").style.display = "none";
  document.getElementById("btnAccion").innerText = "Ingresar";
  document.getElementById("btnAccion").onclick = login;
}

window.onload = modoLogin;
</script>
</body>
</html>
