<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body { font-family: Arial, sans-serif; padding: 16px; max-width: 1200px; margin: auto; background:#f0f0f0; color:#222; }
h2 { text-align:center; color:#222; }
.tabla-wrapper { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; margin-bottom: 20px; font-size:13px; }
th { background:#c8a400; color:#222; padding:8px 10px; text-align:center; border:1px solid #aaa; }
td { border:1px solid #ccc; padding:7px 10px; text-align:center; }
tr:nth-child(even) td { background:#f9f9f9; }
input { width:80px; padding:5px; border:1px solid #ccc; border-radius:4px; background:#fff; text-align:center; font-size:13px; color:#222; box-sizing:border-box; }
input[type="date"] { width:130px; }
.fila-totales td { background:#2c2c2c !important; color:#fff; font-weight:bold; }
.btn-nuevo   { margin:10px 0; padding:9px 20px; background:#2c2c2c; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; }
.btn-guardar { margin:10px 0 10px 10px; padding:9px 20px; background:#c8a400; color:#222; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; }
.th-secretaria { background:#2c2c2c !important; color:#fff !important; letter-spacing:3px; font-size:15px; }
.th-externos   { background:#2c2c2c !important; color:#fff !important; font-size:13px; }
.th-col        { background:#c8a400 !important; color:#222 !important; font-weight:bold; }
.panel { background:#fff; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
td strong { color:#2c2c2c; }
</style>
</head>
<body>
<h2>SECRETARÍA</h2>

<div class="panel">
  <button class="btn-nuevo" onclick="nuevoEvento()">+ Nuevo Evento</button>
  <button class="btn-guardar" onclick="guardarSecretaria()">💾 Guardar</button>

  <div class="tabla-wrapper">
  <table id="tablaSecretaria">
    <thead>
      <tr>
        <th colspan="6" class="th-secretaria">S E C R E T A R Í A</th>
        <th colspan="2" class="th-externos">EVENTOS EXTERNOS</th>
      </tr>
      <tr>
        <th class="th-col">Evento No.</th>
        <th class="th-col">Fecha</th>
        <th class="th-col">Visitas</th>
        <th class="th-col">Miembros</th>
        <th class="th-col">Invitados por Eventos</th>
        <th class="th-col">Asistencia por Eventos</th>
        <th class="th-col">No. Eventos</th>
        <th class="th-col">Invitados</th>
      </tr>
    </thead>
    <tbody id="cuerpo"></tbody>
    <tfoot>
      <tr class="fila-totales">
        <td colspan="2">TOTALES</td>
        <td id="totV">0</td>
        <td id="totM">0</td>
        <td id="totI">0</td>
        <td id="totA">0</td>
        <td id="totNE">0</td>
        <td id="totIN">0</td>
      </tr>
    </tfoot>
  </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB1SeqgsMF6qFSEm8M4rlF9QeBP2F2HP4Q",
  authDomain: "sistema2026-fihnec.firebaseapp.com",
  projectId: "sistema2026-fihnec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let codigoUsuario = "";
let numeroEvento  = 1;

auth.onAuthStateChanged(async (user) => {
  if (user) {
    const docUser = await db.collection("usuarios").doc(user.uid).get();
    codigoUsuario = docUser.data().codigoCapitulo;
    cargarEventos();
  } else {
    window.location.href = "login.html";
  }
});

async function cargarEventos() {
  const snapshot = await db.collection("secretaria")
    .where("codigoCapitulo", "==", codigoUsuario)
    .orderBy("eventoNumero", "asc")
    .get();

  const cuerpo = document.getElementById("cuerpo");
  cuerpo.innerHTML = "";
  numeroEvento = 1;

  snapshot.forEach(doc => {
    const d = doc.data();
    agregarFila(d.eventoNumero, d.fecha, d.visitas, d.miembros, d.invitados, d.asistencia, d.noEventos, d.invitadosExt);
    if (d.eventoNumero >= numeroEvento) numeroEvento = d.eventoNumero + 1;
  });

  calcularTotales();
}

function agregarFila(num, fecha, visitas, miembros, invitados, asistencia, noEventos, invitadosExt) {
  const cuerpo = document.getElementById("cuerpo");
  const tr = document.createElement("tr");
  tr.id = "fila-" + num;
  tr.innerHTML = `
    <td><strong>${num}</strong></td>
    <td><input type="date" id="f${num}" value="${fecha || ''}" onchange="calcularTotales()"></td>
    <td><input type="number" id="v${num}" value="${visitas || ''}" oninput="calcularAsistencia(${num}); calcularTotales()"></td>
    <td><input type="number" id="m${num}" value="${miembros || ''}" oninput="calcularAsistencia(${num}); calcularTotales()"></td>
    <td><input type="number" id="i${num}" value="${invitados || ''}" oninput="calcularAsistencia(${num}); calcularTotales()"></td>
    <td id="as${num}" style="font-weight:bold; background:#f5f5f5;">${asistencia || 0}</td>
    <td><input type="number" id="ne${num}" value="${noEventos || ''}" oninput="calcularTotales()"></td>
    <td><input type="number" id="ie${num}" value="${invitadosExt || ''}" oninput="calcularTotales()"></td>
  `;
  cuerpo.appendChild(tr);
}

function calcularAsistencia(num) {
  const v = parseFloat(document.getElementById("v"  + num)?.value) || 0;
  const m = parseFloat(document.getElementById("m"  + num)?.value) || 0;
  const i = parseFloat(document.getElementById("i"  + num)?.value) || 0;
  document.getElementById("as" + num).innerText = v + m + i;
}

function calcularTotales() {
  let totV=0, totM=0, totI=0, totA=0, totNE=0, totIN=0;
  for (let n = 1; n < numeroEvento; n++) {
    totV  += parseFloat(document.getElementById("v"  + n)?.value) || 0;
    totM  += parseFloat(document.getElementById("m"  + n)?.value) || 0;
    totI  += parseFloat(document.getElementById("i"  + n)?.value) || 0;
    totA  += parseFloat(document.getElementById("as" + n)?.innerText) || 0;
    totNE += parseFloat(document.getElementById("ne" + n)?.value) || 0;
    totIN += parseFloat(document.getElementById("ie" + n)?.value) || 0;
  }
  document.getElementById("totV").innerText  = totV;
  document.getElementById("totM").innerText  = totM;
  document.getElementById("totI").innerText  = totI;
  document.getElementById("totA").innerText  = totA;
  document.getElementById("totNE").innerText = totNE;
  document.getElementById("totIN").innerText = totIN;
}

function nuevoEvento() {
  const hoy = new Date().toISOString().split("T")[0];
  agregarFila(numeroEvento, hoy, '', '', '', 0, '', '');
  numeroEvento++;
  calcularTotales();
}

async function guardarSecretaria() {
  const previos = await db.collection("secretaria")
    .where("codigoCapitulo", "==", codigoUsuario)
    .get();
  const batch = db.batch();
  previos.forEach(doc => batch.delete(doc.ref));
  await batch.commit();

  for (let n = 1; n < numeroEvento; n++) {
    const fecha        = document.getElementById("f"  + n)?.value || "";
    const visitas      = parseFloat(document.getElementById("v"  + n)?.value) || 0;
    const miembros     = parseFloat(document.getElementById("m"  + n)?.value) || 0;
    const invitados    = parseFloat(document.getElementById("i"  + n)?.value) || 0;
    const asistencia   = parseFloat(document.getElementById("as" + n)?.innerText) || 0;
    const noEventos    = parseFloat(document.getElementById("ne" + n)?.value) || 0;
    const invitadosExt = parseFloat(document.getElementById("ie" + n)?.value) || 0;

    await db.collection("secretaria").add({
      codigoCapitulo: codigoUsuario,
      eventoNumero: n,
      fecha, visitas, miembros, invitados,
      asistencia, noEventos, invitadosExt
    });
  }
  alert("Guardado correctamente.");
}
</script>
</body>
</html>
