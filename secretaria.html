<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; padding: 16px; max-width: 1200px; margin: auto; background:#f0f0f0; color:#222; }
h2 { text-align:center; color:#222; margin-top: 10px; }

/* Logo esquina superior derecha */
#logoTop { position: fixed; top: 12px; right: 16px; height: 48px; z-index: 999; }

/* Panel blanco */
.panel { background:#fff; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }

/* Botones */
.btn { padding:9px 20px; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; }
.btn-nuevo    { background:#2c2c2c; color:#fff; }
.btn-guardar  { background:#c8a400; color:#222; margin-left:10px; }
.btn-eventos  { background:#2980b9; color:#fff; margin-left:10px; }
.btn-editar   { background:#c8a400; color:#222; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:12px; }
.btn-eliminar { background:#c0392b; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:12px; }
.btn-ver      { background:#2980b9; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:12px; }
.btn-quitar   { background:#e74c3c; color:#fff; border:none; padding:4px 10px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:bold; }

/* Tabla principal */
.tabla-wrapper { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; margin-bottom: 10px; font-size:13px; }
th { background:#c8a400; color:#222; padding:8px 10px; text-align:center; border:1px solid #aaa; }
td { border:1px solid #ccc; padding:7px 8px; text-align:center; }
tr:nth-child(even) td { background:#f9f9f9; }
.fila-totales td { background:#2c2c2c !important; color:#fff; font-weight:bold; }
.th-secretaria { background:#2c2c2c !important; color:#fff !important; letter-spacing:3px; font-size:15px; }
.th-externos   { background:#2c2c2c !important; color:#fff !important; font-size:13px; }
.th-col        { background:#c8a400 !important; color:#222 !important; font-weight:bold; }

/* Inputs sin flechas de scroll */
input[type=number] {
  width:80px; padding:5px; border:1px solid #ccc; border-radius:4px;
  background:#fff; text-align:center; font-size:13px; color:#222;
  -moz-appearance: textfield;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="date"] { width:130px; padding:5px; border:1px solid #ccc; border-radius:4px; font-size:13px; color:#222; }

/* Panel eventos guardados */
#panelEventos { display:none; }
.filtros-eventos { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
.filtros-eventos label { font-size:13px; font-weight:bold; display:flex; flex-direction:column; gap:4px; }
.filtros-eventos select { padding:7px 10px; border-radius:6px; border:1px solid #ccc; font-size:13px; background:#fff; }

/* Lista eventos guardados */
.eventos-lista { width:100%; border-collapse:collapse; font-size:13px; }
.eventos-lista th { background:#2c2c2c; color:#fff; padding:8px; text-align:center; }
.eventos-lista td { border:1px solid #ccc; padding:7px; text-align:center; }
.eventos-lista tr:nth-child(even) td { background:#f9f9f9; }

/* Modal ver */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; overflow-y:auto; }
.modal-box { background:#fff; padding:28px; border-radius:12px; min-width:300px; max-width:480px; width:90%; margin:20px auto; }

/* Modo edicion */
.modo-edicion { background:#fff3cd; border:2px solid #c8a400; border-radius:10px; padding:4px 12px;
  display:inline-block; margin-bottom:10px; font-size:13px; }

td.asistencia-auto { background:#f0f0f0; font-weight:bold; }
</style>
</head>
<body>

<!-- Logo esquina superior derecha -->
<img src="logo.png" id="logoTop" alt="Logo FIHNEC">

<h2>SECRETARÍA</h2>

<!-- Panel eventos guardados -->
<div class="panel" id="panelEventos">
  <div class="filtros-eventos">
    <label>Año
      <select id="filtroAnio" onchange="renderEventosGuardados()"><option value="">Todos</option></select>
    </label>
    <label>Mes
      <select id="filtroMes" onchange="renderEventosGuardados()">
        <option value="">Todos</option>
        <option value="01">Enero</option><option value="02">Febrero</option>
        <option value="03">Marzo</option><option value="04">Abril</option>
        <option value="05">Mayo</option><option value="06">Junio</option>
        <option value="07">Julio</option><option value="08">Agosto</option>
        <option value="09">Septiembre</option><option value="10">Octubre</option>
        <option value="11">Noviembre</option><option value="12">Diciembre</option>
      </select>
    </label>
  </div>
  <div style="overflow-x:auto;">
    <table class="eventos-lista">
      <thead><tr>
        <th>#</th><th>Fecha</th><th>Visitas</th><th>Miembros</th>
        <th>Invitados</th><th>Asistencia</th><th>No.Ev.Ext</th><th>Inv.Ext</th>
        <th>Ver</th><th>Editar</th><th>Eliminar</th>
      </tr></thead>
      <tbody id="cuerpoGuardados"></tbody>
    </table>
  </div>
</div>

<!-- Formulario -->
<div class="panel">
  <div id="tagEdicion" class="modo-edicion" style="display:none;">✏️ Editando evento del <span id="fechaEdicion"></span></div>

  <button class="btn btn-nuevo"   onclick="nuevoEvento()">+ Nuevo Evento</button>
  <button class="btn btn-guardar" onclick="guardarSecretaria()">💾 Guardar Todo</button>
  <button class="btn btn-eventos" onclick="toggleEventos()">📋 Eventos Guardados</button>

  <div style="margin-top:14px;" class="tabla-wrapper">
  <table id="tablaSecretaria">
    <thead>
      <tr>
        <th colspan="7" class="th-secretaria">S E C R E T A R Í A</th>
        <th colspan="2" class="th-externos">EVENTOS EXTERNOS</th>
      </tr>
      <tr>
        <th class="th-col">Evento No.</th>
        <th class="th-col">Fecha</th>
        <th class="th-col">Visitas</th>
        <th class="th-col">Miembros</th>
        <th class="th-col">Invitados por Eventos</th>
        <th class="th-col">Asistencia por Eventos</th>
        <th class="th-col">Quitar fila</th>
        <th class="th-col">No. Eventos</th>
        <th class="th-col">Invitados</th>
      </tr>
    </thead>
    <tbody id="cuerpo"></tbody>
    <tfoot>
      <tr class="fila-totales">
        <td colspan="2">TOTALES</td>
        <td id="totV">0</td><td id="totM">0</td><td id="totI">0</td>
        <td id="totA">0</td><td></td>
        <td id="totNE">0</td><td id="totIN">0</td>
      </tr>
    </tfoot>
  </table>
  </div>
</div>

<!-- Modal Ver -->
<div class="modal-overlay" id="modalVer">
  <div class="modal-box">
    <h3 style="text-align:center; margin-bottom:16px;">📄 Detalle del Evento</h3>
    <table style="width:100%; border-collapse:collapse; font-size:14px;" id="tablaVer"></table>
    <br>
    <button onclick="cerrarModal()" style="width:100%; padding:10px; background:#2c2c2c; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:15px;">Cerrar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB1SeqgsMF6qFSEm8M4rlF9QeBP2F2HP4Q",
  authDomain: "sistema2026-fihnec.firebaseapp.com",
  projectId: "sistema2026-fihnec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let codigoUsuario  = "";
let eventosCache   = []; // todos los eventos guardados en Firestore
let filasNuevas    = []; // filas temporales en el formulario
let contadorFilas  = 0;
let editandoDocId  = null; // id del doc que se está editando

auth.onAuthStateChanged(async (user) => {
  if (user) {
    const docUser = await db.collection("usuarios").doc(user.uid).get();
    codigoUsuario = docUser.data().codigoCapitulo || "";
    await cargarEventos();
  } else {
    window.location.href = "login.html";
  }
});

// ── CARGAR EVENTOS DESDE FIRESTORE ──
async function cargarEventos() {
  const snap = await db.collection("secretaria")
    .where("codigoCapitulo", "==", codigoUsuario)
    .get();

  eventosCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  eventosCache.sort((a, b) => {
    if (a.fecha < b.fecha) return -1;
    if (a.fecha > b.fecha) return 1;
    return (a.eventoNumero||0) - (b.eventoNumero||0);
  });

  poblarFiltroAnios();
  renderEventosGuardados();
}

// ── POBLAR FILTRO DE AÑOS ──
function poblarFiltroAnios() {
  const anios = [...new Set(eventosCache.map(e => e.fecha ? e.fecha.substring(0,4) : "").filter(Boolean))].sort();
  const sel = document.getElementById("filtroAnio");
  sel.innerHTML = '<option value="">Todos</option>';
  anios.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
}

// ── RENDER LISTA EVENTOS GUARDADOS ──
function renderEventosGuardados() {
  const anio = document.getElementById("filtroAnio").value;
  const mes  = document.getElementById("filtroMes").value;

  let lista = eventosCache;
  if (anio) lista = lista.filter(e => e.fecha && e.fecha.startsWith(anio));
  if (mes)  lista = lista.filter(e => e.fecha && e.fecha.substring(5,7) === mes);

  const tbody = document.getElementById("cuerpoGuardados");
  tbody.innerHTML = "";
  if (lista.length === 0) {
    tbody.innerHTML = `<tr><td colspan="11" style="color:#aaa;">No hay eventos registrados</td></tr>`;
    return;
  }
  lista.forEach((ev, i) => {
    tbody.innerHTML += `<tr>
      <td>${i+1}</td>
      <td>${ev.fecha || ""}</td>
      <td>${ev.visitas||0}</td><td>${ev.miembros||0}</td>
      <td>${ev.invitados||0}</td><td>${ev.asistencia||0}</td>
      <td>${ev.noEventos||0}</td><td>${ev.invitadosExt||0}</td>
      <td><button class="btn-ver"      onclick="verEvento('${ev.id}')">Ver</button></td>
      <td><button class="btn-editar"   onclick="editarEvento('${ev.id}')">Editar</button></td>
      <td><button class="btn-eliminar" onclick="eliminarEvento('${ev.id}')">Eliminar</button></td>
    </tr>`;
  });
}

// ── TOGGLE PANEL EVENTOS ──
function toggleEventos() {
  const panel = document.getElementById("panelEventos");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

// ── NUEVO EVENTO (fila temporal) ──
function nuevoEvento() {
  // Si estamos editando, cancelar primero
  if (editandoDocId) cancelarEdicion();

  contadorFilas++;
  const id  = contadorFilas;
  const hoy = new Date().toISOString().split("T")[0];
  filasNuevas.push(id);

  const tbody = document.getElementById("cuerpo");
  const tr = document.createElement("tr");
  tr.id = "fila-nueva-" + id;
  tr.innerHTML = `
    <td><strong>Nuevo</strong></td>
    <td><input type="date" id="fn_f${id}" value="${hoy}" onchange="calcularTotales()"></td>
    <td><input type="number" id="fn_v${id}"  oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td><input type="number" id="fn_m${id}"  oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td><input type="number" id="fn_i${id}"  oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td id="fn_as${id}" class="asistencia-auto">0</td>
    <td><button class="btn-quitar" onclick="quitarFila(${id})">✕ Quitar</button></td>
    <td><input type="number" id="fn_ne${id}" oninput="calcularTotales()"></td>
    <td><input type="number" id="fn_ie${id}" oninput="calcularTotales()"></td>
  `;
  tbody.appendChild(tr);
  calcularTotales();
}

// ── QUITAR FILA NUEVA ──
function quitarFila(id) {
  document.getElementById("fila-nueva-" + id)?.remove();
  filasNuevas = filasNuevas.filter(f => f !== id);
  calcularTotales();
}

// ── EDITAR EVENTO GUARDADO ──
function editarEvento(docId) {
  const ev = eventosCache.find(e => e.id === docId);
  if (!ev) return;

  // Limpiar filas nuevas primero
  limpiarFilasNuevas();

  editandoDocId = docId;
  document.getElementById("tagEdicion").style.display = "inline-block";
  document.getElementById("fechaEdicion").innerText   = ev.fecha || "";

  contadorFilas++;
  const id = contadorFilas;
  filasNuevas.push(id);

  const tbody = document.getElementById("cuerpo");
  const tr = document.createElement("tr");
  tr.id = "fila-nueva-" + id;
  tr.style.background = "#fff9e6";
  tr.innerHTML = `
    <td><strong>Editando</strong></td>
    <td><input type="date" id="fn_f${id}" value="${ev.fecha||''}" onchange="calcularTotales()"></td>
    <td><input type="number" id="fn_v${id}"  value="${ev.visitas||''}"  oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td><input type="number" id="fn_m${id}"  value="${ev.miembros||''}" oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td><input type="number" id="fn_i${id}"  value="${ev.invitados||''}" oninput="calcularAsistenciaNueva(${id}); calcularTotales()"></td>
    <td id="fn_as${id}" class="asistencia-auto">${ev.asistencia||0}</td>
    <td><button class="btn-quitar" onclick="cancelarEdicion()">✕ Cancelar</button></td>
    <td><input type="number" id="fn_ne${id}" value="${ev.noEventos||''}"    oninput="calcularTotales()"></td>
    <td><input type="number" id="fn_ie${id}" value="${ev.invitadosExt||''}" oninput="calcularTotales()"></td>
  `;
  tbody.appendChild(tr);
  calcularTotales();
  document.querySelector(".panel:last-of-type").scrollIntoView({ behavior:"smooth" });
}

function cancelarEdicion() {
  editandoDocId = null;
  document.getElementById("tagEdicion").style.display = "none";
  limpiarFilasNuevas();
  calcularTotales();
}

// ── ELIMINAR EVENTO ──
async function eliminarEvento(docId) {
  if (!confirm("¿Eliminar este evento?")) return;
  await db.collection("secretaria").doc(docId).delete();
  await cargarEventos();
  alert("Evento eliminado.");
}

// ── GUARDAR ──
async function guardarSecretaria() {
  if (filasNuevas.length === 0) { alert("No hay filas nuevas para guardar."); return; }

  for (const id of filasNuevas) {
    const fecha        = document.getElementById(`fn_f${id}`)?.value  || "";
    const visitas      = parseFloat(document.getElementById(`fn_v${id}`)?.value)  || 0;
    const miembros     = parseFloat(document.getElementById(`fn_m${id}`)?.value)  || 0;
    const invitados    = parseFloat(document.getElementById(`fn_i${id}`)?.value)  || 0;
    const asistencia   = parseFloat(document.getElementById(`fn_as${id}`)?.innerText) || 0;
    const noEventos    = parseFloat(document.getElementById(`fn_ne${id}`)?.value) || 0;
    const invitadosExt = parseFloat(document.getElementById(`fn_ie${id}`)?.value) || 0;

    const datos = { codigoCapitulo: codigoUsuario, fecha, visitas, miembros, invitados, asistencia, noEventos, invitadosExt };

    if (editandoDocId) {
      await db.collection("secretaria").doc(editandoDocId).update(datos);
      editandoDocId = null;
      document.getElementById("tagEdicion").style.display = "none";
    } else {
      // Calcular número de evento para este capítulo
      const maxNum = eventosCache.length > 0 ? Math.max(...eventosCache.map(e => e.eventoNumero||0)) : 0;
      datos.eventoNumero = maxNum + 1;
      await db.collection("secretaria").add(datos);
    }
  }

  limpiarFilasNuevas();
  await cargarEventos();
  calcularTotales();
  alert("Guardado correctamente.");
}

// ── LIMPIAR FILAS NUEVAS ──
function limpiarFilasNuevas() {
  filasNuevas.forEach(id => document.getElementById("fila-nueva-" + id)?.remove());
  filasNuevas = [];
  document.getElementById("cuerpo").innerHTML = "";
  calcularTotales();
}

// ── CÁLCULOS ──
function calcularAsistenciaNueva(id) {
  const v = parseFloat(document.getElementById(`fn_v${id}`)?.value)  || 0;
  const m = parseFloat(document.getElementById(`fn_m${id}`)?.value)  || 0;
  const i = parseFloat(document.getElementById(`fn_i${id}`)?.value)  || 0;
  const el = document.getElementById(`fn_as${id}`);
  if (el) el.innerText = v + m + i;
}

function calcularTotales() {
  let totV=0, totM=0, totI=0, totA=0, totNE=0, totIN=0;
  filasNuevas.forEach(id => {
    totV  += parseFloat(document.getElementById(`fn_v${id}`)?.value)       || 0;
    totM  += parseFloat(document.getElementById(`fn_m${id}`)?.value)       || 0;
    totI  += parseFloat(document.getElementById(`fn_i${id}`)?.value)       || 0;
    totA  += parseFloat(document.getElementById(`fn_as${id}`)?.innerText)  || 0;
    totNE += parseFloat(document.getElementById(`fn_ne${id}`)?.value)      || 0;
    totIN += parseFloat(document.getElementById(`fn_ie${id}`)?.value)      || 0;
  });
  document.getElementById("totV").innerText  = totV;
  document.getElementById("totM").innerText  = totM;
  document.getElementById("totI").innerText  = totI;
  document.getElementById("totA").innerText  = totA;
  document.getElementById("totNE").innerText = totNE;
  document.getElementById("totIN").innerText = totIN;
}

// ── VER EVENTO ──
function verEvento(docId) {
  const ev = eventosCache.find(e => e.id === docId);
  if (!ev) return;
  const filas = [
    ["Fecha",           ev.fecha||""],
    ["Visitas",         ev.visitas||0],
    ["Miembros",        ev.miembros||0],
    ["Invitados",       ev.invitados||0],
    ["Asistencia",      ev.asistencia||0],
    ["No. Ev. Externos",ev.noEventos||0],
    ["Invitados Ext.",  ev.invitadosExt||0],
  ];
  document.getElementById("tablaVer").innerHTML = filas.map((f,i) => `
    <tr style="background:${i%2===0?'#f9f9f9':'#fff'}">
      <td style="padding:7px 10px; font-weight:bold; border-bottom:1px solid #eee;">${f[0]}</td>
      <td style="padding:7px 10px; text-align:right; border-bottom:1px solid #eee;">${f[1]}</td>
    </tr>`).join("");
  document.getElementById("modalVer").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modalVer").style.display = "none";
}
</script>
</body>
</html>
