<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Eventos - FIHNEC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; min-height: 100vh; }
  .topbar {
    background: #2c2c2c; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
  }
  .topbar h1 { font-size: 16px; letter-spacing: 1px; }
  .topbar a { color: #c8a400; font-size: 13px; text-decoration: none; }
  .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
  .panel {
    background: #fff; border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .panel-title {
    font-size: 13px; font-weight: bold; letter-spacing: 1px;
    color: #2c2c2c; border-bottom: 2px solid #c8a400;
    padding-bottom: 8px; margin-bottom: 16px; text-transform: uppercase;
  }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
  .form-group label { font-size: 12px; font-weight: bold; color: #555; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; background: #fff; color: #222; width: 100%;
  }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .btn { padding: 9px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
  .btn-guardar  { background: #2c2c2c; color: #fff; }
  .btn-eliminar { background: #c0392b; color: #fff; font-size: 12px; padding: 5px 12px; }
  .btn-toggle   { background: #c8a400; color: #222; font-size: 12px; padding: 5px 12px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .evento-card {
    border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px;
    margin-bottom: 10px; background: #fafafa;
  }
  .evento-card.inactivo { opacity: 0.55; background: #f5f5f5; }
  .evento-card .ec-nombre { font-size: 15px; font-weight: bold; }
  .evento-card .ec-meta { font-size: 12px; color: #888; margin: 4px 0 8px; }
  .evento-card .ec-desc { font-size: 13px; color: #555; margin-bottom: 10px; }
  .badge-activo   { background: #27ae60; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 11px; margin-left:8px; }
  .badge-inactivo { background: #bbb;    color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 11px; margin-left:8px; }
  .alert-ok  { background:#e8f8ef; border:1px solid #27ae60; color:#1a7a40; border-radius:6px; padding:10px 14px; font-size:13px; margin-top:10px; }
  .alert-err { background:#fdecea; border:1px solid #c0392b; color:#922b21; border-radius:6px; padding:10px 14px; font-size:13px; margin-top:10px; }
  #mensajeCargando { text-align:center; padding:40px; color:#888; font-size:15px; }
  .oculto { display:none !important; }
  .tipo-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .tipo-btn {
    padding:6px 14px; border:2px solid #ddd; border-radius:20px;
    background:#fff; cursor:pointer; font-size:13px; font-weight:bold; color:#555;
  }
  .tipo-btn.activo { background:#c8a400; border-color:#c8a400; color:#222; }
</style>
</head>
<body>

<div class="topbar">
  <h1>📅 ADMINISTRAR EVENTOS PROGRAMADOS</h1>
  <a href="index.html">← Volver al inicio</a>
</div>

<div class="container">
  <div id="mensajeCargando">Verificando acceso...</div>

  <div id="contenido" class="oculto">

    <!-- Formulario nuevo evento -->
    <div class="panel">
      <div class="panel-title">➕ Programar Nuevo Evento</div>

      <div class="form-row">
        <div class="form-group" style="flex:2;">
          <label>Nombre del Evento *</label>
          <input type="text" id="evNombre" placeholder="Ej: SAEL Varones Junio 2026">
        </div>
      </div>

      <label style="font-size:12px; font-weight:bold; color:#555; display:block; margin-bottom:6px;">Tipo de Evento *</label>
      <div class="tipo-grid" id="evTipoGrid">
        <button class="tipo-btn" onclick="selEvTipo('SAEL')">SAEL</button>
        <button class="tipo-btn" onclick="selEvTipo('SAL')">SAL</button>
        <button class="tipo-btn" onclick="selEvTipo('Convención Nacional')">Convención Nacional</button>
        <button class="tipo-btn" onclick="selEvTipo('Avivamiento')">Avivamiento</button>
      </div>

      <div id="evSubtipoWrap" class="oculto" style="margin-bottom:12px;">
        <label style="font-size:12px; font-weight:bold; color:#555; display:block; margin-bottom:6px;">Categoría *</label>
        <div class="tipo-grid" id="evSubtipoGrid"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fecha de Inicio</label>
          <input type="date" id="evFechaIni">
        </div>
        <div class="form-group">
          <label>Fecha de Fin</label>
          <input type="date" id="evFechaFin">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="evDesc" placeholder="Información adicional del evento..."></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-guardar" onclick="guardarEvento()">💾 Guardar Evento</button>
      </div>
      <div id="alertForm"></div>
    </div>

    <!-- Lista de eventos programados -->
    <div class="panel">
      <div class="panel-title">📋 Eventos Programados</div>
      <div id="listaEventos"><p style="color:#aaa; font-size:13px;">Sin eventos programados aún.</p></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB1SeqgsMF6qFSEm8M4rlF9QeBP2F2HP4Q",
  authDomain: "sistema2026-fihnec.firebaseapp.com",
  projectId: "sistema2026-fihnec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

let evTipo = "", evSubtipo = "";

const SUBTIPOS = {
  SAEL: ["Jóvenes","Varones","Damas","Parejas","Mixtos"],
  SAL:  ["Varones","Damas"]
};

auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = "login.html"; return; }
  const doc = await db.collection("usuarios").doc(user.uid).get();
  if (!doc.exists || doc.data().rol !== "maestro") {
    document.getElementById("mensajeCargando").textContent = "Acceso solo para el administrador maestro.";
    return;
  }
  document.getElementById("mensajeCargando").style.display = "none";
  document.getElementById("contenido").classList.remove("oculto");
  cargarEventos();
});

function selEvTipo(tipo) {
  evTipo = tipo; evSubtipo = "";
  document.querySelectorAll("#evTipoGrid .tipo-btn").forEach(b =>
    b.classList.toggle("activo", b.textContent.trim() === tipo));
  const wrap = document.getElementById("evSubtipoWrap");
  const grid = document.getElementById("evSubtipoGrid");
  grid.innerHTML = "";
  if (SUBTIPOS[tipo]) {
    wrap.classList.remove("oculto");
    SUBTIPOS[tipo].forEach(s => {
      const b = document.createElement("button");
      b.className = "tipo-btn";
      b.textContent = s;
      b.onclick = () => {
        evSubtipo = s;
        document.querySelectorAll("#evSubtipoGrid .tipo-btn").forEach(x =>
          x.classList.toggle("activo", x.textContent === s));
      };
      grid.appendChild(b);
    });
  } else {
    wrap.classList.add("oculto");
    evSubtipo = tipo;
  }
}

async function guardarEvento() {
  const nombre = document.getElementById("evNombre").value.trim();
  if (!nombre)  { alerta("alertForm","El nombre es obligatorio.","err"); return; }
  if (!evTipo)  { alerta("alertForm","Selecciona el tipo de evento.","err"); return; }
  if (SUBTIPOS[evTipo] && !evSubtipo) { alerta("alertForm","Selecciona la categoría.","err"); return; }

  await db.collection("eventosProgramados").add({
    nombre,
    tipo:       evTipo,
    subtipo:    evSubtipo || evTipo,
    fechaInicio: document.getElementById("evFechaIni").value || "",
    fechaFin:    document.getElementById("evFechaFin").value || "",
    descripcion: document.getElementById("evDesc").value.trim(),
    activo: true,
    creadoEn: firebase.firestore.FieldValue.serverTimestamp()
  });

  // Limpiar formulario
  document.getElementById("evNombre").value = "";
  document.getElementById("evFechaIni").value = "";
  document.getElementById("evFechaFin").value = "";
  document.getElementById("evDesc").value = "";
  evTipo = ""; evSubtipo = "";
  document.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("activo"));
  document.getElementById("evSubtipoWrap").classList.add("oculto");

  alerta("alertForm","Evento programado guardado correctamente.","ok");
  cargarEventos();
}

async function cargarEventos() {
  const snap = await db.collection("eventosProgramados")
    .orderBy("creadoEn","desc").get();
  const lista = document.getElementById("listaEventos");
  if (snap.empty) { lista.innerHTML = '<p style="color:#aaa;font-size:13px;">Sin eventos programados aún.</p>'; return; }
  lista.innerHTML = snap.docs.map(doc => {
    const e = doc.data();
    const activo = e.activo !== false;
    return `<div class="evento-card ${activo ? "" : "inactivo"}">
      <div class="ec-nombre">${e.nombre}
        <span class="${activo ? "badge-activo" : "badge-inactivo"}">${activo ? "Activo" : "Inactivo"}</span>
      </div>
      <div class="ec-meta">
        ${e.tipo} ${e.subtipo && e.subtipo !== e.tipo ? "— " + e.subtipo : ""}
        &nbsp;|&nbsp; ${e.fechaInicio||"sin fecha"} ${e.fechaFin ? "→ " + e.fechaFin : ""}
      </div>
      <div class="ec-desc">${e.descripcion||""}</div>
      <div class="btn-row">
        <button class="btn btn-toggle" onclick="toggleEvento('${doc.id}', ${activo})">
          ${activo ? "⏸ Desactivar" : "▶ Activar"}
        </button>
        <button class="btn btn-eliminar" onclick="eliminarEvento('${doc.id}')">🗑 Eliminar</button>
      </div>
    </div>`;
  }).join("");
}

async function toggleEvento(id, activo) {
  await db.collection("eventosProgramados").doc(id).update({ activo: !activo });
  cargarEventos();
}

async function eliminarEvento(id) {
  if (!confirm("¿Eliminar este evento programado?")) return;
  await db.collection("eventosProgramados").doc(id).delete();
  cargarEventos();
}

function alerta(id, msg, tipo) {
  const el = document.getElementById(id);
  el.className = tipo === "ok" ? "alert-ok" : "alert-err";
  el.textContent = msg;
  setTimeout(() => { el.textContent = ""; el.className = ""; }, 3500);
}
</script>
</body>
</html>
